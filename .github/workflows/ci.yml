name: SchoolSafe F0 CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run server tests
        run: npm test
      - name: Typecheck server
        run: npm run typecheck
