name: SchoolSafe F0 Dependency Lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright at workspace root and lock it
        shell: bash
        run: |
          npm install -D -W playwright
          npm run ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: lock Playwright for browser QA"
          git push origin HEAD:${GITHUB_HEAD_REF}
