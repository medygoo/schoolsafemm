name: Bootstrap F1 Supabase Harness
on:
  push:
    branches: ["staging/foundation-f1-2026-08-15"]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7.0.1
        with:
          ref: staging/foundation-f1-2026-08-15
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7.0.0
        with:
          node-version: 22
      - name: Install exact local test tooling
        run: |
          npm install --save-exact --save-dev supabase pg
          npm pkg set 'scripts.supabase:start=supabase start'
          npm pkg set 'scripts.supabase:reset=supabase db reset'
          npm pkg set 'scripts.test:rls=node scripts/run-rls-tests.mjs'
      - name: Generate local Supabase config without production identifiers
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          npx --yes supabase init
          cp supabase/config.toml "$GITHUB_WORKSPACE/supabase/config.toml"
      - name: Commit generated harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json supabase/config.toml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: pin local Supabase RLS harness"
          git push origin HEAD:staging/foundation-f1-2026-08-15
