name: Bootstrap F1 SDK Dependencies
on:
  push:
    branches: ["staging/foundation-f1-2026-08-15"]
permissions:
  contents: write
jobs:
  dependencies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7.0.1
        with:
          ref: staging/foundation-f1-2026-08-15
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7.0.0
        with:
          node-version: 22
      - name: Install and pin F1 SDK tooling
        run: |
          npm install --save-exact @supabase/supabase-js
          npm install --save-exact --workspace server @supabase/supabase-js
          npm install --save-exact --save-dev esbuild
      - name: Commit manifests and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json server/package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: pin F1 Supabase SDK dependencies"
          git push origin HEAD:staging/foundation-f1-2026-08-15
