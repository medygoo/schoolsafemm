<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SchoolSafe V2 — Prototype V3</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04112a}
    iframe{display:block;width:100%;height:100%;border:0;background:#04112a}
  </style>
</head>
<body>
  <iframe id="schoolsafe-v3" src="./index.html" title="SchoolSafe V2 — Prototype V3"></iframe>
  <script>
    const frame = document.getElementById('schoolsafe-v3');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById('schoolsafe-v3-theme')) return;
      const link = doc.createElement('link');
      link.id = 'schoolsafe-v3-theme';
      link.rel = 'stylesheet';
      link.href = './v3-theme.css';
      doc.head.appendChild(link);
    });
  </script>
</body>
</html>
